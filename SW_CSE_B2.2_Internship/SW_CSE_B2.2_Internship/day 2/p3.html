<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <p> Unordered list: list and group related items for better readability</p>
    <ul>
        <li>aoao 1</li>
        <li>eoeo 2</li>
        <li>wowo3</li>
    </ul>
    <ul style="list-style-type:circle">
        <li>aoao 1</li>
        <li>eoeo 2</li>
        <li>wowo3</li>
    </ul>
    <P> ordered list</P>
    <ol>
        <li>haha</li>
        <li>yoyo 2</li>
        <li>yoyo 3</li>
    </ol>
    <!-- Ol type variations -->
<ol start="4">
  <li>Laptop</li>
  <li>Phone</li>
  <li>ipad</li>
</ol>
</body>
</html>
