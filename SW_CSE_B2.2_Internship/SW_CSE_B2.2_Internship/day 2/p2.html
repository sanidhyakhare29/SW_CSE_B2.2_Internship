<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>href tag</title>
</head>
<body>
    <p>href tag: <a>tag /hyperlink reference
    </p>
    <a href="https://www.google.com/">take me to google
    </a>
    <br> 
    <br>   
    <a href="p1.html"> take me to p1.html file</a>
    <!-- Attribute: target: _blank:opens in a new tab | _self: opens link in same tab | 
_parent: opens the link in the parent frame| _top-->
<a href="https://www.google.com/" target="_blank">_blank: Google.com</a>
<a href="https://www.google.com/" target="_self">_self: Google.com</a>
<a href="https://www.google.com/" target="_parent">_parent: Google.com</a>
</body>
</html>
