<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
</head>
<body>
    <form action="" method="post">
        
        <!-- Personal Details -->
        <fieldset>
            <p>
                <input type="text" name="fullname" id="fullname" placeholder="Enter fullname">
            </p>
            <p>
                <input type="email" name="email" id="email" placeholder="Enter email">
            </p>
            <p>
                <input type="number" name="age" id="age" placeholder="Enter age">
            </p>
        </fieldset>

        <!-- Preferences Section -->
        <fieldset>
            <legend>Preferences</legend>
            
            <!-- Gender Selection -->
            <p>Gender:</p>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>  

            <!-- Skills Checkboxes -->
            <p>Skills:</p>
            <input type="checkbox" name="skills" id="html" value="html">
            <label for="html">html</label>

            <input type="checkbox" name="skills" id="css" value="css">
            <label for="css">css</label>

            <input type="checkbox" name="skills" id="javascript" value="javascript">
            <label for="javascript">Javascript</label>

            <input type="checkbox" name="skills" id="reactjs" value="reactjs">
            <label for="reactjs">ReactJS</label>
        </fieldset>

        <!-- Country Selection -->
        <fieldset>  
            <p>
                <label for="country">Country:</label><br>
                <!-- Dropdown menu -->
                <select name="country" id="country">
                    <option value="" disabled selected>Select your country</option>
                    <option value="us">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="ca">Canada</option>
                    <option value="in">India</option>
                    <option value="au">Australia</option>
                </select>
            </p>

            <!-- Added Message Textarea -->
            <p>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" rows="4" cols="50"></textarea>
            </p>
        </fieldset>

        <!-- Submit Button -->
        <p>
            <button type="submit">Submit</button>
        </p>

    </form>
</body>
</html>
