<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables 5</title>
</head>
<body>
    <!-- Spanning rows and Columns -->
    <h4>colspan</h4>
    <table border="2">
        <tr>
            <th colspan="3">Student Details</th>
        </tr>
        <tr>
            <td colspan="2">Name</td>
            <td>Rakesh</td>
        </tr>
        <tr>
            <td rowspan="2">Courses</td>
            <td>Web Development</td>
            <td>HTML / CSS</td>
        </tr>
        <tr>
            <td>Database</td>
            <td>SQL</td>
        </tr>
    </table>
</body>
</html>
