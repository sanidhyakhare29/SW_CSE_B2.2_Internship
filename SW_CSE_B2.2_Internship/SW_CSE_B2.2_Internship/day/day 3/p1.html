<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>

    <form action="URL" method="POST">
        <label for="fullname">Enter fullname</label>
        <input type="text" name="fullname" id="fullname"><br>

        <label for="emailid">Enter Email id</label>
        <input type="email" name="emailid" id="emailid"><br>

        <label for="mypassword">Enter Password</label>
        <input type="password" name="mypassword" id="mypassword"><br>

        <label for="age">Enter Age</label>
        <input type="number" name="age" id="age"><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
