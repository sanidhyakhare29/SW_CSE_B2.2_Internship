<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sibling selector</title>
    <style>
        /* Sibling selector */
        h2+p{
            color:chocolate;
        }
    </style>
</head>
<body>
    <h2>CSS Selectors</h2>
    <p>Sibling selector: Selects the elements which are next to each other.</p>
    <p>One more paragraph.</p>
    <h2>Heading tag</h2>
</body>
</html>
